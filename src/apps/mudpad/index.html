<body>
  <div id="content" aria-labelledby="instructions">
    <a class="skip-link" href="#container">Skip to editor</a>
    <div id="toolbar">
      <div class="kbd-panel" aria-label="Keyboard shortcuts">
        <span class="kbd-row"><kbd>Ctrl</kbd><kbd>E</kbd> Focus editor</span>
        <span class="kbd-row"><kbd>Esc</kbd> Focus <strong>Plain</strong> wrap</span>
        <span class="kbd-row"><kbd>F1</kbd> Commands</span>
      </div>
      <div>
        <button type="button" class="button" id="wrap" aria-describedby="instructions" aria-controls="container"
          title="No indentation.">
          <span class="glyph">⤭</span><span class="label">Plain</span>
        </button>
        <button type="button" class="button" id="iwrap" aria-describedby="instructions" aria-controls="container"
          title="Every paragraph's first line is indented 3 spaces.">
          <span class="glyph">➜</span><span class="label">Indented</span>
        </button>
        <button type="button" class="button" id="hwrap" aria-describedby="instructions" aria-controls="container"
          title="Every paragraph's line after the first is indented 5 spaces.">
          <span class="glyph">⤷</span><span class="label">Hanging</span>
        </button>
        <button type="button" class="button" id="cleanup" aria-describedby="instructions" aria-controls="container"
          title="Remove diacritics from the text.">
          <span class="glyph">⌫</span><span class="label">Clean up</span>
        </button>
      </div>
    </div>
    <div>
      <div id="container" role="textbox" aria-multiline="true" aria-label="Text editor for wrapping"
        aria-describedby="instructions" tabindex="0"></div>
    </div>
  </div>

  <mud-history app-id="mudpad"></mud-history>
</body>
