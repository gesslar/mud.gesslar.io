<body>
  <div id="content">
    <section class="section">
      <h2 class="section-heading">Select a date and time in your local time</h2>
      <div class="group">
        <input type="date" id="rldateinput" class="field" aria-label="Date">
        <input type="time" id="rltimeinput" class="field" aria-label="Time">
        <button type="button" id="convert" class="button" aria-label="Convert">
          <i class="codicon codicon-play" aria-hidden="true"></i>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-heading">Result</h2>

      <div class="result-block">
        <div class="result-label">Eastern Date/Time</div>
        <div class="group">
          <input type="text" id="etdatetimeoutput" class="field result" readonly aria-label="Eastern date and time">
          <button type="button" id="copyet" class="button" aria-label="Copy Eastern date and time">
            <i class="codicon codicon-copy" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="result-block">
        <div class="result-label">In Character Date/Time</div>
        <div class="group">
          <input type="text" id="icdatetimeoutput" class="field result" readonly aria-label="In character date and time">
          <button type="button" id="copyic" class="button" aria-label="Copy in character date and time">
            <i class="codicon codicon-copy" aria-hidden="true"></i>
          </button>
        </div>

        <div class="more-info-label">Additional Information</div>
        <div id="icmoreinfo" class="more-info"></div>
      </div>
    </section>
  </div>

  <mud-history app-id="threshtime"></mud-history>
</body>
