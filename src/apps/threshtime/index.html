<body>
  <div id="content">
    <section class="section">
      <h2 class="section-heading">Select a date and time in your local time</h2>
      <div class="group">
        <label for="rldateinput" class="visually-hidden">Local date</label>
        <input type="date" id="rldateinput" class="field">
        <label for="rltimeinput" class="visually-hidden">Local time</label>
        <input type="time" id="rltimeinput" class="field">
        <button type="button" id="convert" class="button" aria-label="Convert">
          <i class="codicon codicon-play" aria-hidden="true"></i>
        </button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-heading">Result</h2>

      <div class="result-block">
        <label class="result-label" for="etdatetimeoutput">Eastern Date/Time</label>
        <div class="group">
          <input type="text" id="etdatetimeoutput" class="field result" readonly>
          <button type="button" id="copyet" class="button" aria-label="Copy Eastern date and time">
            <i class="codicon codicon-copy" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="result-block">
        <label class="result-label" for="icdatetimeoutput">In Character Date/Time</label>
        <div class="group">
          <input type="text" id="icdatetimeoutput" class="field result" readonly>
          <button type="button" id="copyic" class="button" aria-label="Copy in character date and time">
            <i class="codicon codicon-copy" aria-hidden="true"></i>
          </button>
        </div>

        <div class="more-info-label" id="icmoreinfo-label">Additional Information</div>
        <div id="icmoreinfo" class="more-info" role="region" aria-labelledby="icmoreinfo-label"></div>
      </div>
      <p id="result-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </div>

  <mud-history app-id="threshtime"></mud-history>
</body>
